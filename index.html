<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kaedo Kwan Blog — Portal de noticias" />
  <title>Kaedo Kwan Blog</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand">
        <img class="brand__logo" src="assets/img/logo.png" alt="Logo Kaedo Kwan" />
        <span class="brand__title">Kaedo Kwan Blog</span>
      </a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema">
        <span class="theme-toggle__icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Kaedo Kwan Blog</p>
    </div>
  </footer>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
