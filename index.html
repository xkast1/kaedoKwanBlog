<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kaedo Kwan Blog — Portal de noticias" />
  <title>Kaedo Kwan Blog</title>
  <link rel="icon" type="image/png" href="assets/img/banner.jpg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="topbar">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema">
      <span class="theme-toggle__icon" aria-hidden="true"></span>
    </button>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand">
        <img class="brand__logo" src="assets/img/banner.jpg" alt="Logo Kaedo Kwan" />
      </a>
    </div>
  </header>

  <main class="container layout">
    <nav id="sidebar" class="sidebar" aria-label="Navegación principal">
      <button id="sidebar-toggle" class="sidebar__toggle" type="button"
              aria-label="Expandir o contraer menú" aria-expanded="true">
        <span class="sidebar__toggle-icon" aria-hidden="true"></span>
      </button>
      <a href="#/" class="sidebar__link">
        <span class="sidebar__link-icon" aria-hidden="true">🏠</span>
        <span class="sidebar__link-text">Inicio</span>
      </a>
      <a href="#/nosotros" class="sidebar__link">
        <span class="sidebar__link-icon" aria-hidden="true">ℹ️</span>
        <span class="sidebar__link-text">Nosotros</span>
      </a>
    </nav>
    <section id="app" class="content" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Kaedo Kwan Blog</p>
    </div>
  </footer>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
